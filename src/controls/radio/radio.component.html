<!-- Radio input with optional projected label; pairs with other radios by `name`. -->
<input
    [attr.autofocus]="autofocus || null"
    [checked]="checked"
    [disabled]="disabled"
    [attr.id]="id || name"
    [attr.name]="name"
    [attr.tabindex]="tabindex"
    type="radio"
    [attr.value]="value"
    (change)="onRadioChange($event)">
<label [attr.for]="id || name">
    <ng-content></ng-content>{{ label }}
</label>
