<!-- Native select; options are projected as `<option>` children. -->
<select
    [attr.autofocus]="autofocus || null"
    [disabled]="disabled"
    [attr.id]="id || name"
    [attr.name]="name"
    [attr.tabindex]="tabindex"
    [value]="value"
    (change)="onSelectChange($event)">
    <ng-content></ng-content>
</select>
