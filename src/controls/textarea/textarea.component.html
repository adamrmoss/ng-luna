<!-- Multi-line text control with CVA bindings and optional row/column hints. -->
<textarea
    [attr.autofocus]="autofocus || null"
    [attr.cols]="cols"
    [disabled]="disabled"
    [attr.id]="id || name"
    [attr.name]="name"
    [attr.placeholder]="placeholder"
    [readonly]="readonly"
    [attr.rows]="rows"
    [attr.tabindex]="tabindex"
    [value]="value"
    (blur)="onTextareaBlur($event)"
    (input)="onTextareaChange($event)"></textarea>
