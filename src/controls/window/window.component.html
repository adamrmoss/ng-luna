<div
    [attr.autofocus]="autofocus || null"
    [cdkDragDisabled]="isDragDisabled"
    class="window"
    cdkDrag
    [attr.id]="id"
    [attr.name]="name"
    [attr.tabindex]="tabindex">
    <div
        cdkDragHandle
        class="title-bar">
        <div class="title-bar-text">{{ title }}</div>
        <div class="title-bar-controls">
            <button
                *ngIf="showMinimize"
                aria-label="Minimize"
                (click)="onMinimize()"></button>
            <button
                *ngIf="showMaximize"
                [attr.aria-label]="isMaximized ? 'Restore' : 'Maximize'"
                (click)="onMaximize()"></button>
            <button
                *ngIf="showHelp"
                aria-label="Help"
                (click)="onHelp()"></button>
            <button
                *ngIf="showClose"
                aria-label="Close"
                (click)="onClose()"></button>
        </div>
    </div>
    <ng-container *ngIf="scrollable; else notScrollable">
        <div
            cdkScrollable
            class="window-body scrollable">
            <ng-content></ng-content>
        </div>
    </ng-container>
    <ng-template #notScrollable>
        <div class="window-body">
            <ng-content></ng-content>
        </div>
    </ng-template>
    <div class="status-bar">
        <ng-content select="[slot='status']"></ng-content>
    </div>
</div>
