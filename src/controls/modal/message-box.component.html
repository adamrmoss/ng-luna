<div
    class="message-box"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="messageBoxTitle ? 'message-box-title' : null"
    aria-describedby="message-box-text">
    <div
        *ngIf="messageBoxTitle"
        class="message-box-title"
        id="message-box-title">
        {{ messageBoxTitle }}
    </div>
    <div class="message-box-content">
        <p
            class="message-box-text"
            id="message-box-text">{{ data.message }}</p>
        <div
            *ngIf="data.type === 'prompt'"
            class="message-box-prompt">
            <luna-input
                [(ngModel)]="promptValue"
                [placeholder]="promptPlaceholder"
                type="text">
            </luna-input>
        </div>
    </div>
    <div class="message-box-buttons">
        <luna-button
            *ngIf="data.type === 'confirm' || data.type === 'prompt'"
            (click)="onCancel()">
            {{ cancelLabel }}
        </luna-button>
        <luna-button
            (click)="onOk()">
            {{ okLabel }}
        </luna-button>
    </div>
</div>
