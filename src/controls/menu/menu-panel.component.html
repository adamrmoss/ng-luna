<!-- Focusable menu list: items, separators, and mouse/keyboard highlight wiring. -->
<ul
    #panel
    class="luna-menu-panel"
    [class.luna-menu-panel-context]="data.variant === 'context'"
    role="menu"
    tabindex="-1">
    @for (entry of entries; track $index)
    {
        @if (isItem(entry))
        {
            <li
                [attr.data-menu-index]="$index"
                [class.luna-menu-item-checked]="entry.checked"
                [class.luna-menu-item-danger]="entry.tone === 'danger'"
                [class.luna-menu-item-disabled]="entry.disabled"
                [class.luna-menu-item-highlighted]="isHighlighted($index)"
                role="menuitem"
                (click)="onItemClick(entry, $event)"
                (mouseenter)="onItemMouseenter($index)"
                (mousemove)="onItemMousemove($event)">
                @if (reservesCheckColumn)
                {
                    <span class="luna-menu-item-checkbox" aria-hidden="true">
                        @if (entry.checked)
                        {
                            <span class="luna-menu-item-checkmark"></span>
                        }
                    </span>
                }
                @if (entry.icon; as icon)
                {
                    <luna-icon
                        size="16"
                        [svg]="icon"></luna-icon>
                }
                <span class="luna-menu-item-label">{{ entry.label }}</span>
            </li>
        }
        @else
        {
            <li
                class="luna-menu-separator"
                role="separator"></li>
        }
    }
</ul>
